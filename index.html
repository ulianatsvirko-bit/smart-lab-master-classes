
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART LAB МАСТЕР-КЛАССЫ | Smart Dance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #09090b;
        }
        .text-glow-yellow { text-shadow: 0 0 8px rgba(253, 204, 0, 0.3); }
        .text-glow-pink { text-shadow: 0 0 8px rgba(244, 114, 182, 0.3); }
        .text-glow-blue { text-shadow: 0 0 8px rgba(96, 165, 250, 0.3); }
        
        .font-handwriting {
            font-family: 'Caveat', cursive;
        }
        
        .bg-mesh {
            background-color: #ffffff;
            background-image: radial-gradient(at 0% 0%, hsla(48,100%,93%,1) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, hsla(0,0%,100%,1) 0, transparent 50%), 
                              radial-gradient(at 100% 0%, hsla(48,100%,93%,1) 0, transparent 50%);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100px) rotate(20deg); opacity: 0; }
        }
        .animate-float-heart {
            animation: float 4s ease-in infinite;
        }

        @keyframes neon-glow-pink {
            0%, 100% { box-shadow: 0 0 15px 2px rgba(244, 63, 94, 0.5); }
            50% { box-shadow: 0 0 35px 10px rgba(244, 63, 94, 0.8); }
        }
        .animate-neon-glow-pink {
            animation: neon-glow-pink 2s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .bg-shimmer-rose {
            background: linear-gradient(90deg, #f43f5e 0%, #fb7185 50%, #f43f5e 100%);
            background-size: 200% 100%;
            animation: shimmer 2.5s infinite linear;
        }

        .confetti {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: confetti-fall 3s linear infinite;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100px) rotate(360deg); opacity: 0; }
        }

        @keyframes soft-pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(244, 63, 94, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }
        .hover-soft-pulse:hover {
            animation: soft-pulse 1.5s infinite;
        }

        /* --- New Scroll Animations --- */
        .reveal-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }

        .reveal-on-scroll.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .scale-on-scroll {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .scale-on-scroll.is-visible {
            opacity: 1;
            transform: scale(1);
        }

        /* Stagger Delays */
        .delay-100 { transition-delay: 100ms; }
        .delay-200 { transition-delay: 200ms; }
        .delay-300 { transition-delay: 300ms; }
        .delay-400 { transition-delay: 400ms; }
        .delay-500 { transition-delay: 500ms; }
    </style>
